[phases.setup]
nixPkgs = ["php", "nodejs"]

[phases.build]
cmds = [
    "composer install --no-dev --optimize-autoloader",
    "npm install",
    "npm run build",
]

[start]
cmd = "cp .env.example .env && php artisan key:generate --force && touch database/database.sqlite && php artisan migrate --force --seed && php artisan serve --host 0.0.0.0 --port $PORT"